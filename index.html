<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapım Aşamasındadır | alikocmersin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 30px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .btn:hover, .btn:active {
      background-color: #0369a1;
      transform: scale(0.96);
    }
    .footer {
      margin-top: 36px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🚧</div>
    <h1>Yapım Aşamasındadır</h1>
    <p>Sitemiz şu anda güncellenmektedir. Çok yakında yeni içeriğimizle hizmetinizdeyiz.</p>

    <a href="./vakif/" class="btn">
      <span>📲 Vakıfbank Sesli Notlar Uygulamasına Git</span>
    </a>

    <div class="footer">
      &copy; 2026 alikocmersin.github.io
    </div>
  </div>

</body>
</html>
